services:
  proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
  backend1:
    image: nginx:latest
    volumes:
      - ./backends/1:/usr/share/nginx/html:ro
  backend2:
    image: nginx:latest
    volumes:
      - ./backends/2:/usr/share/nginx/html:ro
  backend3:
    image: nginx:latest
    volumes:
      - ./backends/3:/usr/share/nginx/html:ro